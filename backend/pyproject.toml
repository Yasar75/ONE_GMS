[project]
name = "one-gms-backend"
version = "0.1.0"
description = "FastAPI backend for ONE_GMS."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.13.1",
  "aiosmtplib==2.0.2",
  "asyncpg==0.29.0",
  "bcrypt==4.2.0",
  "cloudinary==1.41.0",
  "email_validator==2.2.0",
  "fastapi==0.111.0",
  "fastapi-mail==1.4.1",
  "httpx==0.27.0",
  "itsdangerous==2.2.0",
  "passlib==1.7.4",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "PyJWT==2.8.0",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.9",
  "sendgrid==6.11.0",
  "SQLAlchemy==2.0.31",
  "sqlmodel==0.0.18",
  "uvicorn==0.30.5",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
